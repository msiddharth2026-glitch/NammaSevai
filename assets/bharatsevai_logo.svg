  <!-- Kolam-inspired accent on hand -->
  <g transform="translate(390 790)" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -47 C-26 -25 -26 -7 0 0 C26 -7 26 -25 0 -47 Z"/>
    <path d="M47 0 C25 -26 7 -26 0 0 C7 26 25 26 47 0 Z"/>
    <path d="M0 47 C26 25 26 7 0 0 C-26 7 -26 25 0 47 Z"/>
    <path d="M-47 0 C-25 26 -7 26 0 0 C-7 -26 -25 -26 -47 0 Z"/>
    <circle r="7" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="1060" text-anchor="middle"
        font-family="Inter, Arial, sans-serif" font-size="104" font-weight="750"
        letter-spacing="-4" fill="#092D50">BharatSevai<tspan fill="#008F8C"> AI</tspan></text>
  <text x="600" y="1120" text-anchor="middle"
        font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600"
        letter-spacing="5" fill="#557184">PUBLIC SERVICES, MADE ACCESSIBLE</text>
</svg>