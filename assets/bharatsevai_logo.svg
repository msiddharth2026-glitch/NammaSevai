<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <title>BharatSevai AI logo</title>
  <desc>A friendly AI speech assistant supported by a hand, representing accessible Tamil Nadu public services.</desc>
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13A6A0"/>
      <stop offset="1" stop-color="#007C83"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164D78"/>
      <stop offset="1" stop-color="#092D50"/>
    </linearGradient>
  </defs>

  <!-- Tamil Nadu identity mark -->
  <path d="M274 175 L334 139 L392 145 L434 111 L487 128 L521 169 L508 220
