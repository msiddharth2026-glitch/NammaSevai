  <path d="M248 810
           C304 720 386 660 478 641
           C538 628 592 655 650 675
           C706 694 762 693 817 681
           C866 670 900 680 904 707
           C909 733 886 751 854 761
           C922 748 967 713 1004 666
           C1028 636 1051 618 1074 632
           C1098 647 1085 676 1065 706
           C1022 769 972 822 914 864
           C842 916 745 950 636 953
           C514 956 402 920 319 866
           C288 846 265 829 248 810 Z" fill="url(#hand)"/>
  <path d="M245 817 C286 702 382 620 489 608 C543 602 586 615 628 634
           C526 604 423 636 349 706 C307 746 276 790 245 817 Z" fill="#FF9418"/>
  <path d="M248 861 C306 755 402 684 494 672 C429 708 363 771 318 843
           C293 857 270 867 248 884 Z" fill="#16834A"/>

  <!-- Speech bubble -->
  <path d="M430 190
           C430 112 493 62 574 62 H839
           C920 62 981 119 981 197 V397
           C981 475 920 531 839 531 H650
           L575 587 L589 531 H574
           C493 531 430 475 430 397 Z" fill="url(#bubble)"/>

  <!-- Friendly assistant face -->
  <rect x="548" y="203" width="315" height="220" rx="86" fill="#FFFFFF"/>
  <rect x="579" y="247" width="253" height="132" rx="62" fill="#092D50"/>
  <path d="M633 312 Q655 278 677 312 M738 312 Q760 278 782 312"
        fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
  <path d="M706 201 L718 163" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <circle cx="722" cy="148" r="21" fill="#FFFFFF"/>
  <path d="M528 258 C500 267 490 290 490 313 C490 337 501 359 528 368 Z" fill="#FFFFFF"/>
  <path d="M884 258 C912 267 922 290 922 313 C922 337 911 359 884 368 Z" fill="#FFFFFF"/>

  <!-- Voice waves -->
  <path d="M956 235 Q1016 310 956 385 M991 207 Q1076 310 991 413"
        fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <!-- Sparkles -->
  <path d="M905 119 L919 151 L951 165 L919 179 L905 211 L891 179 L859 165 L891 151 Z"
        fill="#FFB21A"/>
  <path d="M988 83 L999 108 L1024 119 L999 130 L988 155 L977 130 L952 119 L977 108 Z"
