# ==============================================================================
# Render Blueprint Specification for NammaSevai AI / BharatSevai AI
# Infrastructure-as-Code (IaC) for Automated Zero-Downtime Deployment
# ==============================================================================

services:
  - type: web
    name: nammasevai-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore # Closest to India for minimal citizen latency
    branch: main
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: APP_NAME
        value: "NammaSevai AI / BharatSevai AI"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: nammasevai-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://nammasevai-web.onrender.com"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: RATE_LIMIT_GENERAL_PER_MINUTE
        value: "120"
      - key: RATE_LIMIT_MATCH_PER_MINUTE
        value: "60"
      - key: RATE_LIMIT_ADMIN_PER_MINUTE
        value: "40"
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: nammasevai-postgres
    plan: starter
    region: singapore
    databaseName: bharatsevai_prod
    user: bharatsevai_admin
    postgresMajorVersion: 16
